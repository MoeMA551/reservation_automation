name: Build Windows app

on:
  push:
    branches: [japanese-version]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onefile --name reservation_arranger --add-data "templates:templates" --add-data "static:static" launcher.py

      - uses: actions/upload-artifact@v7
        with:
          name: reservation_arranger-windows
          path: dist/reservation_arranger.exe
