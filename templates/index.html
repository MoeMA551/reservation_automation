<!DOCTYPE html>
<html>
    <head>
        <title>Reservation Arragner</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            <div>
                <div>Logo</div>
                <div>Hostel Reservation Arranger</div>
            </div>
            <div>Upload a reservation</div>
            <div><p>Drop the raw booking export (.xlsx, .xls or .csv). Rooms and beds are assigned by arrival date, group size and gender, then returned as a formatted workbook.</p></div>
            <div>
                <input type="file" name="file" accept=".xlsx, .xls, .csv" required/>
                <button class="btn" type="submit" id="submit-btn">
                    <i class="ph ph-play" id="submit-icon"></i>
                    <span id="submit-label">Arrange reservations</span>
                </button>
            </div>
        </div>
    </body>
</html>
