<!DOCTYPE html>
<html>
    <head>
        <title>Reservation Arragner</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div id="container">
            <div id="nav-bar">
                <div id="logo">LDK</div>
                <div id="app_title" class="black text-md">オンライン決済照合自動化</div>
            </div>
            <hr>
            <div id="main-title" class="black text-lg">シートをアップロードしてください。</div>
            <div id="description" class="gray text-md"><p>例えば、20260916155913.csv </p></div>
            <div id="card">
                <form action="/process" method="post" enctype="multipart/form-data">
                    <div id="upload-box">
                        <input id="upload-file" type="file" name="file" accept=".xlsx, .xls, .csv" required/>
                    </div>
                    <div id="btn">
                        <button class="btn text-md black" type="submit" id="submit-btn">
                            完了
                        </button>
                    </div>
                    <div id="btn-des" class="gray text-sm">「完了」ボタンを押してください。</div>
                </form>
            </div>
        </div>
    </body>
</html>
